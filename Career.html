    <!-- Career -->
      <section class="Career-form" id="career">
      <div class="container">
        <h2>Career</h2>
        <form>
        <div class="info">
          <label>Full Name</label> 
          <input type="text"  placeholder="Enter your name" required/>
        </div>
         <div class="info">
          <label>Email</label> 
          <input type="email"  placeholder="Enter your email" required/>
        </div>
        <div class="info">
          <label>Phone No</label> 
          <input type="tel"  placeholder="Enter your name" required/>
        </div>
        <div class="info">
          <label>Post</label> 
          <div class="radio">
            <label><input type="radio" name="post" value="Admin" required/>Admin</label>
            <label><input type="radio" name="post" value="Teacher" required/>Teacher</label>
          </div>
        </div>
       <div class="info">
          <label>Resume Upload</label> 
          <input type="file"  accept=".pdf,.doc,.docx" required/>
        </div>
      <button type="submit" class="career-btn">Submit</button>
      </form>
      </div>
      </section>
